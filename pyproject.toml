[project]
name = "finalproject_Kritsyn_M26-555"
version = "0.1.0"
description = "Консольное приложение для имитации валютного кошелька"
readme = "README.md"
authors = [{ name = "Petr Kritsyn" }]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "requests>=2.34.2",
]

[project.scripts]
wallet = "valutatrade_hub.cli.interface:main"
wallet-parser = "valutatrade_hub.parser_service.scheduler:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub", "src/finalproject_kritsyn_m26_555"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.valutatrade]
DATA_DIR = "data"
USERS_FILE = "users.json"
PORTFOLIOS_FILE = "portfolios.json"
RATES_FILE = "rates.json"
RATES_TTL_SECONDS = 300
DEFAULT_BASE_CURRENCY = "USD"
LOG_FILE = "logs/actions.log"
LOG_FORMAT = "json"
LOG_LEVEL = "INFO"
LOG_MAX_BYTES = 1048576
LOG_BACKUP_COUNT = 3
PARSER_LOG_FILE = "logs/parser.log"
HISTORY_FILE = "exchange_rates.json"
REQUEST_TIMEOUT = 10
UPDATE_INTERVAL_SECONDS = 3600
