[project]
name = "finalproject_Kritsyn_M26-555"
version = "0.1.0"
description = "Консольное приложение для имитации валютного кошелька"
readme = "README.md"
authors = [{ name = "Petr Kritsyn" }]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
]

[project.scripts]
wallet = "valutatrade_hub.cli.interface:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub", "src/finalproject_kritsyn_m26_555"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
